<svg width="100%" viewBox="0 0 680 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">Webhook idempotency pattern</title>
  <desc id="d3">A payment webhook arrives and triggers one atomic conditional update: find a record with status pending and set it to confirmed in a single operation. If a matching pending record was found, the order is fulfilled once. If not, the webhook is a duplicate delivery and is safely skipped.</desc>
  <style>
    text{font-family:"Roboto",Arial,sans-serif;}
    .th{font-size:14px;font-weight:700;}
    .ts{font-size:12px;font-weight:400;}
  </style>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="180" height="44" rx="8" fill="#eef0f3" stroke="#adb5bd" stroke-width="1"/>
  <text class="th" x="340" y="46" text-anchor="middle" fill="#3a3d42">Webhook received</text>
  <line x1="340" y1="64" x2="340" y2="94" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="190" y="94" width="300" height="56" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text class="th" x="340" y="117" text-anchor="middle" fill="#04342c">Atomic conditional update</text>
  <text class="ts" x="340" y="136" text-anchor="middle" fill="#085041">filter: status = pending</text>

  <path d="M340,150 L180,190" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text class="ts" x="235" y="176" text-anchor="middle" fill="#5f6167">matched</text>
  <path d="M340,150 L500,190" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text class="ts" x="445" y="176" text-anchor="middle" fill="#5f6167">no match</text>

  <rect x="60" y="190" width="240" height="56" rx="8" fill="#eaf3de" stroke="#639922" stroke-width="1"/>
  <text class="th" x="180" y="213" text-anchor="middle" fill="#173404">Fulfill order</text>
  <text class="ts" x="180" y="232" text-anchor="middle" fill="#3b6d11">confirmed exactly once</text>

  <rect x="380" y="190" width="240" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text class="th" x="500" y="213" text-anchor="middle" fill="#4a1b0c">Skip, return 200</text>
  <text class="ts" x="500" y="232" text-anchor="middle" fill="#712b13">duplicate delivery ignored</text>
</svg>
