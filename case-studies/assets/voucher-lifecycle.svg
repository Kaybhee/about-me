<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">Voucher reservation lifecycle</title>
  <desc id="d2">An order creates a pending voucher reservation. A payment webhook either confirms it or releases it depending on outcome. A separate hourly cron also releases reservations left pending past a 24 hour window.</desc>
  <style>
    text{font-family:"Roboto",Arial,sans-serif;}
    .th{font-size:14px;font-weight:700;}
    .ts{font-size:12px;font-weight:400;}
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="180" height="44" rx="8" fill="#eef0f3" stroke="#adb5bd" stroke-width="1"/>
  <text class="th" x="340" y="46" text-anchor="middle" fill="#3a3d42">Order created</text>
  <line x1="340" y1="64" x2="340" y2="94" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="220" y="94" width="240" height="56" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text class="th" x="340" y="117" text-anchor="middle" fill="#04342c">Reserve voucher</text>
  <text class="ts" x="340" y="136" text-anchor="middle" fill="#085041">status: pending</text>

  <path d="M340,150 L340,170 L225,170 L225,190" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M340,150 L340,170 L525,170 L525,190" fill="none" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow2)"/>

  <rect x="110" y="190" width="230" height="44" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
  <text class="th" x="225" y="216" text-anchor="middle" fill="#26215c">Payment webhook</text>
  <rect x="420" y="190" width="210" height="44" rx="8" fill="#eef0f3" stroke="#adb5bd" stroke-width="1"/>
  <text class="th" x="525" y="216" text-anchor="middle" fill="#3a3d42">Hourly cleanup cron</text>

  <path d="M200,234 L150,280" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="120" y="260" text-anchor="middle" fill="#5f6167">success</text>
  <path d="M250,234 L250,255 L510,255 L510,280" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="380" y="249" text-anchor="middle" fill="#5f6167">failed</text>
  <path d="M510,234 L510,280" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="560" y="260" text-anchor="middle" fill="#5f6167">expired</text>

  <rect x="40" y="280" width="220" height="56" rx="8" fill="#eaf3de" stroke="#639922" stroke-width="1"/>
  <text class="th" x="150" y="303" text-anchor="middle" fill="#173404">Confirm redemption</text>
  <text class="ts" x="150" y="322" text-anchor="middle" fill="#3b6d11">status: confirmed</text>

  <rect x="380" y="280" width="260" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text class="th" x="510" y="303" text-anchor="middle" fill="#4a1b0c">Release reservation</text>
  <text class="ts" x="510" y="322" text-anchor="middle" fill="#712b13">status: released</text>
</svg>
