<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Platform architecture overview</title>
  <desc id="d1">Client apps call an order orchestration layer that routes by order kind through a regional hub to a logistics registry and a payment gateway registry, each abstracting multiple providers, before settling through webhooks and scheduled jobs.</desc>
  <style>
    text{font-family:"Roboto",Arial,sans-serif;}
    .th{font-size:14px;font-weight:700;}
    .ts{font-size:12px;font-weight:400;}
  </style>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="180" height="44" rx="8" fill="#eef0f3" stroke="#adb5bd" stroke-width="1"/>
  <text class="th" x="340" y="46" text-anchor="middle" fill="#3a3d42">Client apps</text>
  <line x1="340" y1="64" x2="340" y2="96" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="220" y="96" width="240" height="56" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
  <text class="th" x="340" y="119" text-anchor="middle" fill="#26215c">Order orchestration</text>
  <text class="ts" x="340" y="138" text-anchor="middle" fill="#3c3489">Routes by order kind</text>

  <line x1="280" y1="152" x2="180" y2="200" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="400" y1="152" x2="500" y2="200" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="70" y="200" width="220" height="44" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
  <text class="th" x="180" y="226" text-anchor="middle" fill="#26215c">Domestic order flow</text>
  <rect x="390" y="200" width="220" height="44" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
  <text class="th" x="500" y="226" text-anchor="middle" fill="#26215c">Cross-border express flow</text>

  <line x1="180" y1="244" x2="230" y2="280" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="500" y1="244" x2="450" y2="280" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="150" y="280" width="380" height="60" rx="12" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
  <text class="th" x="340" y="306" text-anchor="middle" fill="#04342c">Hub</text>
  <text class="ts" x="340" y="326" text-anchor="middle" fill="#085041">Regional node: currency, pricing, providers</text>

  <line x1="240" y1="340" x2="150" y2="390" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="440" y1="340" x2="530" y2="390" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="30" y="390" width="240" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text class="th" x="150" y="413" text-anchor="middle" fill="#4a1b0c">Logistics registry</text>
  <text class="ts" x="150" y="432" text-anchor="middle" fill="#712b13">Pluggable provider interface</text>

  <rect x="410" y="390" width="240" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text class="th" x="530" y="413" text-anchor="middle" fill="#4a1b0c">Payment gateway registry</text>
  <text class="ts" x="530" y="432" text-anchor="middle" fill="#712b13">Pluggable provider interface</text>

  <line x1="150" y1="446" x2="150" y2="476" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="530" y1="446" x2="530" y2="476" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="30" y="476" width="240" height="40" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text class="ts" x="150" y="500" text-anchor="middle" fill="#712b13">Regional + international carriers</text>
  <rect x="410" y="476" width="240" height="40" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
  <text class="ts" x="530" y="500" text-anchor="middle" fill="#712b13">Six integrated payment providers</text>

  <line x1="150" y1="516" x2="290" y2="556" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="530" y1="516" x2="390" y2="556" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="220" y="556" width="240" height="44" rx="8" fill="#eef0f3" stroke="#adb5bd" stroke-width="1"/>
  <text class="th" x="340" y="582" text-anchor="middle" fill="#3a3d42">Webhooks + scheduled jobs</text>
</svg>
